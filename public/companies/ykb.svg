      <path d="M45 10 A35 35 0 0 1 80 45 A35 35 0 0 1 45 80 A35 35 0 0 1 10 45 A35 35 0 0 1 45 10 Z" fill="#ffffff" />
      <circle cx="45" cy="45" r="26" fill="#C81D25" />
