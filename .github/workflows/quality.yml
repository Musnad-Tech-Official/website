name: Project quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Types and Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SEO regression tests
        run: npm run test:seo

      - name: Production integrity regression tests
        run: npm run test:integrity

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit
