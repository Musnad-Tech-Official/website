name: Security dependency lockfile bootstrap

# Temporary, branch-scoped workflow: generate a registry-resolved lockfile,
# then commit package.json + package-lock.json on the review branch only.
on:
  push:
    branches:
      - fix/security-dependencies-20261115
    paths:
      - .github/workflows/security-bootstrap.yml

permissions:
  contents: write

jobs:
  upgrade-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-dependencies-20261115
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve pinned Next.js security update
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.6
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev eslint-config-next@16.4.6

      - name: Resolve safe transitive dependency fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts || echo "Some advisories may require manual review; final security audit enforces pass/fail."

      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): upgrade Next.js and resolve vulnerable transitive packages"
            git push origin HEAD:refs/heads/fix/security-dependencies-20261115
          fi

      - name: Check patched production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Verify reproducible install
        run: npm ci

      - name: Verify dependency versions and audit
        run: |
          npm ls next eslint-config-next sharp seroval source-map-js --all || true
          npm audit --omit=dev --audit-level=high
