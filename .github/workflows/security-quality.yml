name: Production dependency security and quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Security audit and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependency lockfile exactly
        run: npm ci

      - name: Block high and critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: SEO regression tests
        run: npm run test:seo

      - name: Integrity tests (if present)
        run: npm run test:integrity --if-present

      - name: Dashboard tests (if present)
        run: npm run test:admin --if-present

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit
