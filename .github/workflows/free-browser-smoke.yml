name: Free browser smoke with local Next.js and Supabase

on:
  push:
    branches: [chore/staging-playwright-20261115]
    paths:
      - .github/workflows/free-browser-smoke.yml
      - scripts/export-local-supabase-ci.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clerk-development-credentials:
    name: Confirm real Clerk Development key exists
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DEV_CLERK_SECRET: ${{ secrets.MUSNAD_E2E_CLERK_DEV_SECRET_KEY }}
        run: |
          if [[ "${DEV_CLERK_SECRET:-}" == sk_test_* ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Clerk Development key configured; browser checks may proceed.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::error::Browser E2E not run: add repository secret MUSNAD_E2E_CLERK_DEV_SECRET_KEY from Clerk Development, NEVER Production.'
            exit 1
          fi

  local-browser:
    needs: clerk-development-credentials
    if: needs.clerk-development-credentials.outputs.ready == 'true'
    name: Anonymous desktop/mobile browser smoke (test-only Clerk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLERK_SECRET_KEY: ${{ secrets.MUSNAD_E2E_CLERK_DEV_SECRET_KEY }}
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ISOLATED_DATABASE_CONFIRMED: "true"
      SITE_INDEXABLE: "false"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      # This is the PUBLIC development publishable key of the existing Musnad
      # Clerk development instance, not the live/production key.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dmlhYmxlLW1vdGgtMTgxNC5jbGVyay5hY2NvdW50cy5kZXYk
      E2E_STAGING_CLERK_PUBLISHABLE_KEY: pk_test_dmlhYmxlLW1vdGgtMTgxNC5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Use pinned Supabase local CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Prepare schema and seed from approved sources
        run: |
          set -euo pipefail
          supabase init --force
          supabase migration new local_schema
          target="$(find supabase/migrations -maxdepth 1 -type f -name '*_local_schema.sql' | head -n 1)"
          test -n "$target"
          node scripts/build-local-supabase-schema.mjs "$target"
          cp tests/staging/seed.sql supabase/seed.sql

      - name: Start isolated Supabase (no cloud project)
        run: |
          set -euo pipefail
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/musnad-local-start.log 2>&1 || {
            tail -n 70 /tmp/musnad-local-start.log
            exit 1
          }
          supabase status -o env > /tmp/musnad-local-status.env
          chmod 600 /tmp/musnad-local-status.env
          node scripts/smoke-local-supabase.mjs /tmp/musnad-local-status.env
          node scripts/export-local-supabase-ci.mjs /tmp/musnad-local-status.env "$GITHUB_ENV"

      - name: Verify local target cannot access production
        run: node scripts/assert-staging-environment.mjs

      - name: Start Next.js local dev server (bounded readiness check)
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 > /tmp/musnad-local-next.log 2>&1 &
          echo "$!" > /tmp/musnad-next.pid
          echo "Diagnostic: verify Next.js listening port (no credentials)"
          ss -ltn | grep ':3000 ' || true
          for route in /favicon.ico /en; do
            diagnostic="$(curl --noproxy '*' --silent --connect-timeout 2 --max-time 7 -o /dev/null -w '%{http_code} (connect=%{time_connect}s, first_byte=%{time_starttransfer}s)' "http://127.0.0.1:3000$route" 2>/dev/null || true)"
            echo "Diagnostic $route: ${diagnostic:-unreachable}"
          done
          last_status="not_checked"
          for i in $(seq 1 10); do
            last_status="$(curl --noproxy '*' --silent --connect-timeout 2 --max-time 7 -o /tmp/musnad-ready.html -w '%{http_code}' http://127.0.0.1:3000/en 2>/dev/null || true)"
            if [[ "$last_status" == "200" ]]; then
              echo "Local Next.js returned HTTP 200."
              exit 0
            fi
            if [[ "$i" == 1 || "$i" == 5 || "$i" == 10 ]]; then
              echo "Readiness HTTP status: ${last_status:-000} on attempt $i"
            fi
            sleep 2
          done
          echo "::error::Local Next.js did not return HTTP 200 (last status: ${last_status:-000})."
          echo "Diagnostic: TCP listeners on application ports"
          ss -ltnp | grep -E ':3000|:3001|:3333' || true
          echo "Diagnostic: Next.js process state (PID, parent, state, command)"
          ps -eo pid,ppid,stat,comm,args | grep -E '[n]ext-server|[n]ext dev|[n]pm run dev' | head -n 15 || true
          echo "Diagnostic: connection failure category"
          curl --noproxy '*' --connect-timeout 3 --max-time 5 --verbose --output /dev/null http://127.0.0.1:3000/favicon.ico 2>&1 | grep -E 'Failed to connect|Connection refused|Connected to|Operation timed out|HTTP/[0-9]' | head -n 8 || true
          tail -n 80 /tmp/musnad-local-next.log | sed -E 's/(sk_test_|pk_test_|eyJ)[a-zA-Z0-9_.=+-]+/[REDACTED]/g'
          exit 1

      - name: Run actual read-only Playwright tests
        run: npm run test:e2e

      - name: Cleanup isolated local processes and database
        if: always()
        run: |
          if test -f /tmp/musnad-next.pid; then
            kill "$(cat /tmp/musnad-next.pid)" 2>/dev/null || true
          fi
          supabase stop --no-backup || true
