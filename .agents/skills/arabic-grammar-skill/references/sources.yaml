schema_version: 1
updated: "2026-11-06"
policy: source_policy.md
description: >
  سجل المراجع المعتمدة في مهارة النحو. كل تصحيح «قاطع» يجب أن يحيل إلى
  معرّف من هذا الملف. والطبقة (tier) تحدد وزن المصدر، لا مجرد وجوده.
  و`verified_at` تاريخ تحقق بشري، و`status: needs_review` يعني أن الرابط
  لم يُفتح آلياً بعد أو تعذر الوصول إليه، ولا يُعتمد حتى يُراجع.

tiers:
  1:
    name: كتب النحو المحققة
    weight: highest
    use_for: [grammar, irab, khilaf, shawahid]
    rule: "المرجع الأول. يُقدَّم على كل ما دونه، ويُستشهد بالكتاب والجزء والصفحة."
  2:
    name: المجامع اللغوية الرسمية
    weight: high
    use_for: [modern_usage, decisions, terminology, fatwa]
    rule: "يُقدَّم في القرارات اللغوية والمصطلحات الحديثة، ولا يُلغي نصاً نحوياً صريحاً."
  3:
    name: الموسوعات المنهجية
    weight: medium_high
    use_for: [orientation, taxonomy, definition]
    rule: "للوصول إلى الباب وتلخيصه، ثم يُرجع إلى الطبقة الأولى للتثبيت."
  4:
    name: المعاجم
    weight: medium
    use_for: [meaning, attestation, lexical_difference]
    rule: "للدلالة والمعنى، لا للقاعدة النحوية إلا إذا نصّ المعجم على القاعدة."
  5:
    name: مواقع تعليمية ومنتديات
    weight: low
    use_for: [explanation, debate, orientation]
    rule: "مساندة فقط. لا تُنتج تصحيحاً قاطعاً بمفردها."
  6:
    name: غير معتمد
    weight: none
    use_for: []
    rule: "لا يُستشهد به: إجابات الذكاء الاصطناعي، والمدونات المجهولة، وويكيبيديا وحدها، والسوشيال ميديا."

